name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # This repository has no live DNS tests. Keep any provider test switches
  # explicitly disabled and never pass credentials through CI.
  LIBDNS_SPACESHIP_RUN_LIVE: "0"
  LIBDNS_SPACESHIP_CLEANUP: "0"

jobs:
  build-test:
    name: Build & Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.26']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check module tidiness
        run: go mod tidy -diff

      - name: Reject stale upstream libdns dependency (check in case of regressions)
        run: |
          stale='github.com/libdns/'"spaceship"
          ! go list -m all | grep -F "$stale"
          ! grep -R -n --include='*.go' --include='go.mod' --include='go.sum' --exclude-dir=.git "$stale\|replace $stale" .

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race -count=1 ./...
